<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Seminarbegleitung Nicole Ohlemüller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout: ruhige Einspaltigkeit (max 760px) mit einem "Weg" aus Terminpunkten als Leitmotiv; Farben aus nicole-ohlemueller.de */
:root{
  --bg:hsl(37 45% 94%);
  --surface:hsl(37 40% 97.5%);
  --sand:hsl(33 32% 78%);
  --line:hsl(33 24% 84%);
  --ink:hsl(40 4% 14%);
  --muted:hsl(35 8% 38%);
  --petrol:hsl(190 39% 23%);
  --petrol-soft:hsl(190 24% 90%);
  --on-petrol:hsl(37 45% 96%);
  --terra:hsl(18 43% 51%);
  --terra-ink:hsl(18 48% 38%);
  --terra-soft:hsl(18 50% 92%);
  --ok:hsl(152 30% 32%);
  --ok-soft:hsl(152 28% 90%);
  --warn:hsl(36 70% 36%);
  --warn-soft:hsl(40 70% 90%);
  --f-display:"Source Serif 4", "Iowan Old Style", Georgia, serif;
  --f-body:"Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:hsl(195 22% 10%);--surface:hsl(195 20% 13.5%);--sand:hsl(33 16% 42%);--line:hsl(195 14% 23%);
  --ink:hsl(37 30% 90%);--muted:hsl(35 12% 68%);--petrol:hsl(190 36% 64%);--petrol-soft:hsl(190 28% 20%);
  --on-petrol:hsl(195 30% 10%);--terra:hsl(18 55% 62%);--terra-ink:hsl(18 62% 72%);--terra-soft:hsl(18 30% 20%);
  --ok:hsl(152 35% 62%);--ok-soft:hsl(152 25% 18%);--warn:hsl(38 70% 64%);--warn-soft:hsl(38 40% 18%);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:hsl(195 22% 10%);--surface:hsl(195 20% 13.5%);--sand:hsl(33 16% 42%);--line:hsl(195 14% 23%);
  --ink:hsl(37 30% 90%);--muted:hsl(35 12% 68%);--petrol:hsl(190 36% 64%);--petrol-soft:hsl(190 28% 20%);
  --on-petrol:hsl(195 30% 10%);--terra:hsl(18 55% 62%);--terra-ink:hsl(18 62% 72%);--terra-soft:hsl(18 30% 20%);
  --ok:hsl(152 35% 62%);--ok-soft:hsl(152 25% 18%);--warn:hsl(38 70% 64%);--warn-soft:hsl(38 40% 18%);color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding-inline:20px;padding-block:8px 48px}
h1,h2,h3{font-family:var(--f-display);font-weight:500;line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:clamp(1.9rem,5vw,2.6rem);letter-spacing:-.01em}
h2{font-size:1.45rem}
h3{font-size:1.15rem}
p{margin:0}
a{color:var(--petrol)}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.eyebrow{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--terra-ink);font-weight:600}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-lg{display:flex;flex-direction:column;gap:32px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}

/* Kopf */
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding-block:18px;border-bottom:1px solid var(--line);margin-bottom:28px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);background:none;border:0;padding:0;cursor:pointer;font:inherit;text-align:left}
.brand-mark{width:38px;height:38px;flex:none}
.brand-name{font-family:var(--f-display);font-size:1.1rem;line-height:1.1}
.brand-sub{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
nav.tabs{display:flex;flex-wrap:wrap;gap:4px}
nav.tabs button{font:inherit;font-size:.9rem;border:0;background:none;color:var(--muted);padding:8px 12px;border-radius:999px;cursor:pointer}
nav.tabs button[aria-current="page"]{background:var(--petrol);color:var(--on-petrol)}
nav.tabs button:hover:not([aria-current="page"]){color:var(--ink);background:var(--petrol-soft)}

/* Hinweise */
.mode{font-size:.8rem;color:var(--muted);display:flex;gap:8px;align-items:center;margin-bottom:20px}
.mode i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.mode.demo i{background:var(--warn)}
.flash{background:var(--ok-soft);color:var(--ink);border-radius:var(--r);padding:12px 16px;font-size:.95rem;margin-bottom:20px;display:flex;justify-content:space-between;gap:12px}
.flash.err{background:var(--warn-soft)}
.flash button{border:0;background:none;color:inherit;cursor:pointer;font:inherit}

/* Flächen */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.card.quiet{background:transparent}
.hero{padding-block:4px 8px;display:flex;flex-direction:column;gap:12px}
.hero .lead{font-size:1.1rem;max-width:58ch}
.quote{font-family:var(--f-display);font-style:italic;font-size:1.15rem;color:var(--petrol);border-left:2px solid var(--terra);padding-left:16px;max-width:52ch}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.grid2>*{min-width:0}

/* Knöpfe */
.btn{font:inherit;font-weight:500;font-size:.95rem;border-radius:999px;padding:11px 20px;border:1px solid var(--petrol);background:var(--petrol);color:var(--on-petrol);cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none;line-height:1.2}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--petrol)}
.btn.ghost:hover{background:var(--petrol-soft);filter:none}
.btn.terra{background:var(--terra);border-color:var(--terra);color:var(--on-petrol)}
.btn.danger{background:transparent;border-color:var(--terra);color:var(--terra-ink)}
.btn.sm{padding:7px 14px;font-size:.85rem}
.link{font:inherit;background:none;border:0;color:var(--petrol);cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--terra);outline-offset:2px}

/* Pillen */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:600;letter-spacing:.04em;padding:3px 10px;border-radius:999px;background:var(--petrol-soft);color:var(--petrol);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.open{background:var(--terra-soft);color:var(--terra-ink)}
.pill.draft{background:transparent;border:1px dashed var(--sand);color:var(--muted)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}

/* Weg / Timeline */
.path{list-style:none;margin:0;padding:0;position:relative}
.path::before{content:"";position:absolute;left:11px;top:14px;bottom:14px;width:2px;background:var(--line)}
.path li{position:relative;display:grid;grid-template-columns:24px 1fr;gap:14px;padding-block:10px}
.path .dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--sand);background:var(--bg);position:relative;z-index:1;display:grid;place-items:center;font-size:.7rem;color:var(--on-petrol)}
.path li.done .dot{background:var(--petrol);border-color:var(--petrol)}
.path li.next .dot{border-color:var(--terra);box-shadow:0 0 0 5px var(--terra-soft)}
.path .when{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.path .t{font-weight:600}
.path li>div{min-width:0}

/* Aufgaben */
.task{display:flex;flex-direction:column;gap:10px}
.task .head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.task p{color:var(--muted);font-size:.95rem}
.task .btn{align-self:flex-start;margin-top:4px}

/* Übungen */
.ex{border-top:1px solid var(--line);padding-block:4px}
.ex:first-child{border-top:0}
.ex summary{cursor:pointer;list-style:none;display:flex;gap:12px;align-items:baseline;justify-content:space-between;padding-block:12px}
.ex summary::-webkit-details-marker{display:none}
.ex summary .nm{font-weight:600}
.ex summary .meta{font-size:.8rem;color:var(--muted);white-space:nowrap}
.ex .body{padding-bottom:16px;display:flex;flex-direction:column;gap:12px}
.ex ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:4px}
.ex .why{font-size:.92rem;color:var(--muted);background:var(--petrol-soft);border-radius:10px;padding:10px 14px}
.area{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--terra-ink);font-weight:600}
.practice{display:inline-flex;gap:8px;align-items:center;font-size:.9rem;cursor:pointer}
.practice input{accent-color:var(--petrol);width:18px;height:18px}
.care{font-size:.85rem;color:var(--muted);font-style:italic}

/* Formulare */
form{display:flex;flex-direction:column;gap:26px}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;min-width:0}
legend{font-family:var(--f-display);font-size:1.1rem;margin-bottom:8px;padding:0}
label.lbl,.lbl{font-weight:500;font-size:.95rem}
.hint{font-size:.85rem;color:var(--muted)}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=number],input[type=url],textarea,select{font:inherit;font-size:1rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:88px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--petrol);outline:none;box-shadow:0 0 0 3px var(--petrol-soft)}
.scale{display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.scale .q{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.scale output{font-family:var(--f-display);font-size:1.3rem;color:var(--petrol);min-width:2ch;text-align:right;font-variant-numeric:tabular-nums}
.scale .ends{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--petrol)}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.choice{position:relative}
.choice input{position:absolute;opacity:0;inset:0;cursor:pointer}
.choice span{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;height:100%;cursor:pointer}
.choice b{font-weight:600}
.choice small{color:var(--muted);font-size:.83rem}
.choice input:checked+span{border-color:var(--petrol);box-shadow:inset 0 0 0 1px var(--petrol);background:var(--petrol-soft)}
.choice input:focus-visible+span{outline:2px solid var(--terra);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;cursor:pointer}
.chip span{display:inline-block;font-size:.85rem;border:1px solid var(--line);border-radius:999px;padding:5px 12px;background:var(--surface);cursor:pointer}
.chip input:checked+span{background:var(--petrol);color:var(--on-petrol);border-color:var(--petrol)}
.chip input:focus-visible+span{outline:2px solid var(--terra);outline-offset:2px}
.form-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-top:8px;border-top:1px solid var(--line)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.two>*{min-width:0;display:flex;flex-direction:column;gap:6px}
.sess{border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--surface)}
.sess .row{justify-content:space-between}
.confirm{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--terra-soft);border-radius:12px;padding:10px 14px}

/* Admin */
.list{display:flex;flex-direction:column}
.item{display:flex;flex-wrap:wrap;gap:10px 16px;justify-content:space-between;align-items:center;padding-block:14px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .info{min-width:0;flex:1 1 240px}
.item .t{font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat b{display:block;font-family:var(--f-display);font-size:1.7rem;font-weight:500;color:var(--petrol);font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:.82rem;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:minmax(110px,160px) 1fr 64px;gap:10px;align-items:center;font-size:.88rem}
.bar .track{position:relative;height:10px;background:var(--line);border-radius:999px;overflow:hidden}
.bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px}
.bar .pre{background:var(--sand)}
.bar .post{background:var(--petrol);top:3px;bottom:3px}
.bar .v{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right;white-space:nowrap}
.legend{display:flex;gap:16px;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:8px;border-radius:4px;margin-right:6px;vertical-align:middle}
.person summary{cursor:pointer;display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:center;padding-block:14px;list-style:none}
.person summary::-webkit-details-marker{display:none}
.person{border-top:1px solid var(--line)}
.person:first-child{border-top:0}
.person .body{padding-bottom:18px;display:flex;flex-direction:column;gap:16px}
.spark{color:var(--terra)}
.kv{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:4px 14px;font-size:.92rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.subtabs{display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--line);padding-bottom:10px}
.subtabs button{font:inherit;font-size:.9rem;background:none;border:1px solid transparent;border-radius:999px;padding:6px 14px;color:var(--muted);cursor:pointer}
.subtabs button[aria-selected="true"]{border-color:var(--petrol);color:var(--petrol);font-weight:500}
.empty{border:1px dashed var(--sand);border-radius:var(--r);padding:24px;text-align:left;color:var(--muted);display:flex;flex-direction:column;gap:10px}
.empty b{color:var(--ink);font-family:var(--f-display);font-weight:500;font-size:1.1rem}

footer{margin-top:56px;padding-top:20px;border-top:1px solid var(--line);font-size:.85rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}
footer .claim{font-family:var(--f-display);font-style:italic;color:var(--petrol)}
.loading{display:flex;gap:14px;align-items:center;color:var(--muted);padding-block:40px}
.breath{width:28px;height:28px;border-radius:50%;border:2px solid var(--petrol);animation:breath 4s ease-in-out infinite}
@keyframes breath{0%,100%{transform:scale(.7);opacity:.5}50%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion: reduce){.breath{animation:none}}
@media (max-width:520px){.wrap{padding-inline:16px}.card{padding:18px}.bar{grid-template-columns:1fr 56px}.bar .lab{grid-column:1/-1}}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <button class="brand" data-go="home" aria-label="Zur Startseite">
      <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="none" stroke="var(--petrol)" stroke-width="1.5"/><path d="M13 22c2.5-5 5-5 7-2s4.5 3 7-2" fill="none" stroke="var(--terra)" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span><span class="brand-name">Nicole Ohlemüller</span><br><span class="brand-sub">Seminarbegleitung</span></span>
    </button>
    <nav class="tabs" id="nav" aria-label="Bereiche"></nav>
  </header>
  <div id="mode"></div>
  <div id="flash"></div>
  <main id="app"><div class="loading"><div class="breath"></div><p>Einen Atemzug lang Geduld, die Seminarbegleitung lädt.</p></div></main>
  <footer>
    <span class="claim">Vertraulich. Klar. Ohne Druck.</span>
    <span>Kontakt: <span class="sel">kontakt@nicole-ohlemueller.de</span> · <a href="https://www.nicole-ohlemueller.de/impressum" target="_blank" rel="noopener">Impressum</a> · <a href="https://www.nicole-ohlemueller.de/datenschutz-1" target="_blank" rel="noopener">Datenschutz</a></span>
  </footer>
</div>

<script>
/* ---------- Inhalte & Konstanten ---------- */
const AREAS=['Orientierung','Gleichgewicht','Stabilität','Atmung','Wahrnehmung','Grenzen'];
const FORMATS=['Workshop','Training','Mentoring','Sonstiges'];
const STATUS={entwurf:'Entwurf',offen:'Buchbar',laufend:'Läuft',abgeschlossen:'Abgeschlossen'};
const CALENDLY='https://calendly.com/nicole-ohlemueller/30min';
const ITEMS=[
 {k:'ruhe',q:'Wie oft bist du innerlich wirklich ruhig?',lo:'fast nie',hi:'sehr oft',s:'Innere Ruhe'},
 {k:'spueren',q:'Wie früh spürst du, wann es dir zu viel wird?',lo:'erst, wenn nichts mehr geht',hi:'früh und deutlich',s:'Frühwarnsignale'},
 {k:'raum',q:'Wie viel Raum hast du im Kopf für dich selbst?',lo:'kaum welchen',hi:'genug',s:'Raum für mich'},
 {k:'grenzen',q:'Wie leicht fällt es dir, Nein zu sagen?',lo:'sehr schwer',hi:'leicht',s:'Grenzen'},
 {k:'gewissen',q:'Wie frei bist du von schlechtem Gewissen, wenn du etwas für dich tust?',lo:'gar nicht',hi:'ganz',s:'Ohne schlechtes Gewissen'},
 {k:'erholung',q:'Wie gut kannst du dich erholen, im Schlaf und in Pausen?',lo:'kaum',hi:'gut',s:'Erholung'},
 {k:'praesenz',q:'Wie oft bist du innerlich da, bei dir?',lo:'selten',hi:'meistens',s:'Präsenz'}
];
const ZUSTAND=[
 {k:'da',t:'Ruhig und da',d:'Ich spüre mich, der Atem geht leicht.'},
 {k:'strom',t:'Unter Strom',d:'Innerlich angespannt, der Kopf läuft.'},
 {k:'leer',t:'Müde und leer',d:'Wenig Energie, eher abgeschaltet.'},
 {k:'unklar',t:'Weiß ich gerade nicht',d:'Auch das ist eine gute Antwort.'}
];
const WUNSCH=[
 {k:'einstieg',t:'Erst mal verstehen',d:'Ein Abend als Einstieg in das Thema Nervensystem.',f:'Workshop'},
 {k:'ueben',t:'Regelmäßig üben',d:'Über mehrere Wochen dranbleiben, in einer Gruppe.',f:'Training'},
 {k:'begleitung',t:'Persönliche Begleitung',d:'Meine Situation als Mutter und Führungskraft sortieren.',f:'Mentoring'},
 {k:'offen',t:'Weiß ich noch nicht',d:'Ich möchte mich erst orientieren.',f:'Workshop'}
];
const ZEIT=[{k:'abend',t:'Einen Abend'},{k:'woche',t:'Einmal pro Woche'},{k:'flex',t:'Das ist gerade schwer zu sagen'}];

/* Startinhalte, nur für den Demo-Modus ohne zentrale Ablage */
const DEFAULTS={"exercises":[
{"id":"ex-umschauen","title":"Langsam umschauen","area":"Orientierung","duration":3,"summary":"Den Raum mit Augen und Kopf langsam erkunden und dem Körper zeigen: Hier ist es sicher.","steps":["Setz dich bequem hin, beide Füße am Boden.","Lass deinen Blick langsam durch den Raum wandern, der Kopf darf mitgehen.","Bleib dort kurz stehen, wo dein Blick gern verweilt.","Wende dich auch zur Seite und nach hinten, so weit es angenehm ist.","Spür nach: Hat sich an Atmung oder Schultern etwas verändert?"],"why":"Orientierung im Raum ist eine der ältesten Sicherheitsprüfungen des Nervensystems. Findet es nichts Bedrohliches, darf die Anspannung sinken."},
{"id":"ex-weitwinkel","title":"Weiter Blick","area":"Orientierung","duration":2,"summary":"Vom Tunnelblick in die Weite: das ganze Sichtfeld wahrnehmen.","steps":["Such dir einen Punkt vor dir auf Augenhöhe.","Lass den Blick weich werden, ohne den Punkt zu verlieren.","Nimm wahr, was du am Rand deines Sichtfelds siehst, links, rechts, oben, unten.","Bleib 30 bis 60 Sekunden in diesem weiten Blick."],"why":"Der Tunnelblick gehört zum Stressmodus. Ein weiter Blick ist ein Signal in die andere Richtung."},
{"id":"ex-benennen","title":"Fünf Dinge benennen","area":"Orientierung","duration":2,"summary":"Mit den Sinnen zurück in den Moment, wenn das Gedankenkarussell läuft.","steps":["Benenne leise fünf Dinge, die du siehst.","Dann vier Geräusche, die du hörst.","Dann drei Stellen, an denen dein Körper etwas berührt.","Zum Schluss ein Atemzug, bei dem du nur zuhörst."],"why":"Holt die Aufmerksamkeit aus dem Kopf zurück in den Raum und in den Körper."},

async function init(){
  if(location.hash==='#demo')return initLocal();
  try{
    const base='https://www.gstatic.com/firebasejs/'+FB_V+'/';
    const [a,b,c]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);
    FB={...a,...b,...c};
  }catch(e){return initLocal(true)}
  const app=FB.initializeApp(FB_CFG);
  S.auth=FB.getAuth(app);S.auth.languageCode='de';
  S.fs=FB.getFirestore(app);
  S.mode='fb';
  const onErr=()=>showFlash('Die Verbindung zur Datenbank ist unterbrochen. Lade die Seite bitte neu.',true);
  FB.onSnapshot(FB.collection(S.fs,'seminars'),s=>{S.seminars=s.docs.map(d=>({...d.data(),id:d.id}));S.pubReady=true;soft()},onErr);
  FB.onSnapshot(FB.collection(S.fs,'exercises'),s=>{S.exercises=s.docs.map(d=>({...d.data(),id:d.id}));soft()},onErr);
  if(FB.isSignInWithEmailLink(S.auth,location.href)){
    const email=lsGet(EKEY);
    if(email)await completeLink(email);else{S.view='confirm-email'}
  }
  FB.onAuthStateChanged(S.auth,async u=>{
    (S.unsubs||[]).forEach(f=>{try{f()}catch(e){}});S.unsubs=[];
    S.user=u;S.me={};S.isAdmin=false;S.responses=[];S.bookings=[];
    if(u){
      S.unsubs.push(FB.onSnapshot(FB.doc(S.fs,'responses',u.uid),d=>{if(!pending)S.me=d.exists()?clone(d.data()):{};S.meReady=true;soft()},()=>{S.meReady=true;soft()}));
      S.isAdmin=!!u.emailVerified&&ADMINS.includes((u.email||'').toLowerCase());
      if(S.isAdmin){
        S.unsubs.push(FB.onSnapshot(FB.collection(S.fs,'responses'),s=>{S.responses=s.docs.map(d=>({...d.data(),id:d.id}));soft()},()=>{}));
        S.unsubs.push(FB.onSnapshot(FB.collection(S.fs,'bookings'),s=>{S.bookings=s.docs.map(d=>({...d.data(),id:d.id}));soft()},()=>{}));
      }
    }else{S.meReady=false}
    S.authReady=true;
    if(S.view==='confirm-email'&&u)S.view='home';
    render();
  });
}

let pending=0,chain=Promise.resolve();
function persistMe(){
  S.me.updatedAt=new Date().toISOString();
  if(S.mode==='local'){saveLocal();return Promise.resolve(true)}
  if(!S.user){showFlash('Bitte melde dich zuerst an.',true);return Promise.resolve(false)}
  const body=clone(S.me);if(!body.consentAt)body.consentAt=new Date().toISOString();body.email=S.user.email||'';pending++;
  const ref=FB.doc(S.fs,'responses',S.user.uid);
  chain=chain.then(()=>FB.setDoc(ref,body)).then(()=>true).catch(e=>{showFlash(writeErr(e),true);return false}).finally(()=>{pending--});
  return chain;
}
async function saveDoc(col,obj){
  const arr=col==='seminars'?S.seminars:S.exercises;
  if(S.mode==='local'){const i=arr.findIndex(x=>x.id===obj.id);if(i>=0)arr[i]=obj;else arr.push(obj);saveLocal();return true}
  const {id,...body}=obj;
  try{await FB.setDoc(FB.doc(S.fs,col,id),body);return true}catch(e){showFlash(writeErr(e),true);return false}
}
async function delDoc(col,id){
  if(S.mode==='local'){const arr=col==='seminars'?S.seminars:S.exercises;const i=arr.findIndex(x=>x.id===id);if(i>=0)arr.splice(i,1);saveLocal();return true}
  try{await FB.deleteDoc(FB.doc(S.fs,col,id));return true}catch(e){showFlash(writeErr(e),true);return false}
}

}

async function deleteMyData(){
  if(S.mode==='local'){S.me={};saveLocal();return true}
  try{
    pending++;
    await FB.deleteDoc(FB.doc(S.fs,'responses',S.user.uid));
    pending--;S.me={};
    try{await FB.deleteUser(S.user)}catch(e){await FB.signOut(S.auth)}
    return true;
  }catch(e){pending=Math.max(0,pending-1);showFlash(writeErr(e),true);return false}
}
function authErr(e,how){
  const c=e&&e.code||'';
  if(c.includes('invalid-credential')||c.includes('wrong-password')||c.includes('user-not-found'))return 'E-Mail oder Passwort stimmt nicht. Neu hier? Dann tipp auf „Konto anlegen“.';
  if(c.includes('email-already-in-use'))return 'Für diese E-Mail-Adresse gibt es schon ein Konto. Tipp auf „Anmelden“.';
  if(c.includes('weak-password'))return 'Das Passwort ist zu kurz. Bitte nimm mindestens 8 Zeichen.';
  if(c.includes('popup-closed')||c.includes('cancelled-popup'))return 'Die Google-Anmeldung wurde abgebrochen.';
  if(c.includes('popup-blocked'))return 'Dein Browser hat das Google-Fenster blockiert. Bitte erlaube Pop-ups für diese Seite.';
  if(c.includes('operation-not-allowed'))return 'Diese Anmeldeart ist gerade nicht freigeschaltet.';
  return writeErr(e);
}
function writeErr(e){
  const c=e&&e.code||'';
  if(c.includes('permission-denied'))return 'Dafür fehlt dir die Berechtigung. Bist du mit der richtigen E-Mail-Adresse angemeldet?';
  if(c.includes('unavailable'))return 'Gerade besteht keine Verbindung. Bitte prüf dein Internet und versuch es noch einmal.';
  if(c.includes('invalid-email'))return 'Diese E-Mail-Adresse sieht nicht ganz richtig aus. Bitte prüf sie noch einmal.';
  if(c.includes('quota')||c.includes('too-many'))return 'Es wurden gerade zu viele Anfragen gesendet. Bitte versuch es in ein paar Minuten noch einmal.';
  return 'Das hat gerade nicht geklappt. Bitte versuch es gleich noch einmal.';
}

function renderNav(){

  $('#nav').innerHTML=items.map(([k,t])=>`<button data-go="${k}" ${cur===k?'aria-current="page"':''}>${t}</button>`).join('');
  let m='';
  if(S.mode==='local')m=`<p class="mode demo"><i></i>Demo-Modus: Einträge bleiben nur in diesem Browser.</p>`;
  else if(S.mode==='fb'&&S.user)m=`<p class="mode"><i></i>Angemeldet als ${esc(S.user.email||'')}${S.isAdmin?' · Admin':''} · <button class="link small" data-act="logout">Abmelden</button></p>`;
  $('#mode').innerHTML=m;
}

function render(){
  if(S.mode==='loading')return;
  renderNav();renderFlash();
  let v=S.view;let html='';

  if(S.mode==='fb'&&!S.authReady&&v!=='booking'&&v!=='booking-result')html=loadingHtml();

  else if(v==='home')html=viewHome();
  else if(v==='assess')html=viewAssess();
  else if(v==='checkin')html=viewCheckin();
  else if(v==='booking')html=viewBooking();
  else if(v==='booking-result')html=viewBookingResult();
  else if(v==='mydata')html=viewMyData();
  else if(v==='admin')html=S.isAdmin?viewAdmin():viewHome();
  else if(v==='sem-edit')html=viewSemEdit();
  else if(v==='ex-edit')html=viewExEdit();
  $('#app').innerHTML=html;

function firstDateLabel(s){const d=(s.sessions||[]).find(x=>x.date);return d?(s.sessions.length>1?'ab ':'')+fmtDate(d.date):'Termine folgen'}
function myRec(sid){S.me.seminars=S.me.seminars||{};S.me.seminars[sid]=S.me.seminars[sid]||{};return S.me.seminars[sid]}
function viewDashboard(sem){
  const r=(S.me.seminars||{})[sem.id]||{};
  const sessions=sem.sessions||[];
  const nx=nextSession(sem);
  const doneS=sessions.filter(x=>x.done);
  const allDone=sessions.length&&!nx;
  const ci=r.checkins||{};
  const pathHtml=sessions.map((x,i)=>`<li class="${x.done?'done':x===nx?'next':''}"><span class="dot">${x.done?'✓':''}</span><div>
    <p class="when">${esc(fmtDate(x.date))}${x.time?' · '+esc(x.time):''}${x===nx?' · <b style="color:var(--terra-ink)">Nächster Termin</b>':''}</p>
    <p class="t">${sessions.length>1?`Termin ${i+1}: `:''}${esc(x.title||'')}</p>
    ${x.focus?`<p class="muted small">${esc(x.focus)}</p>`:''}</div></li>`).join('');
  const tasks=[];
  tasks.push(`<div class="card task"><div class="head"><h3>Selbsteinschätzung vorab</h3>${r.pre?'<span class="pill ok">Erledigt</span>':'<span class="pill open">Offen</span>'}</div>
    <p>${r.pre?`Ausgefüllt am ${esc(fmtStamp(r.pre.at))}. Du kannst sie jederzeit anpassen.`:'Sieben kurze Fragen, wie es dir gerade geht. Es gibt kein Richtig oder Falsch.'}</p>
    <button class="btn ${r.pre?'ghost':''}" data-act="open-assess" data-kind="pre">${r.pre?'Ansehen und ändern':'Jetzt einschätzen'}</button></div>`);
  if(nx){const done=ci[nx.id];
    tasks.push(`<div class="card task"><div class="head"><h3>Check-In vor dem nächsten Termin</h3>${done?'<span class="pill ok">Erledigt</span>':'<span class="pill open">Offen</span>'}</div>
    <p>${esc(fmtDate(nx.date))}${nx.title?' · '+esc(nx.title):''}. ${done?'Danke, Nicole weiß, wie du ankommst.':'Wie kommst du an? So kann Nicole den Termin auf die Gruppe abstimmen.'}</p>
    <button class="btn ${done?'ghost':''}" data-act="open-checkin" data-sess="${esc(nx.id)}">${done?'Check-In ändern':'Check-In starten'}</button></div>`);
  }
  if(allDone||r.post){
    tasks.push(`<div class="card task"><div class="head"><h3>Abschluss-Einschätzung</h3>${r.post?'<span class="pill ok">Erledigt</span>':'<span class="pill open">Offen</span>'}</div>
    <p>Dieselben Fragen wie zu Beginn. So siehst du, was sich verändert hat.</p>
    <button class="btn ${r.post?'ghost':''}" data-act="open-assess" data-kind="post">${r.post?'Ansehen und ändern':'Jetzt einschätzen'}</button></div>`);
  }
  const practiced=r.practiced||{};
  const exHtml=doneS.length?doneS.slice().reverse().map(x=>{
    const exs=(x.exerciseIds||[]).map(exById).filter(Boolean);
    if(!exs.length)return '';
    return `<section class="card stack"><div><p class="eyebrow">${esc(fmtDate(x.date))}</p><h3>${esc(x.title||'Termin')}</h3></div><div>${exs.map(e=>exerciseHtml(e,sem.id,!!practiced[e.id])).join('')}</div></section>`;
  }).join(''):`<div class="empty"><b>Nach jedem Termin erscheinen hier eure Übungen.</b><span>Mit Anleitung zum Nachüben und einem Häkchen, wenn du sie im Alltag ausprobiert hast.</span></div>`;
  const cmp=r.pre&&r.post?`<section class="stack"><h2>Vorher und nachher</h2><div class="card stack"><div class="legend"><span><i style="background:var(--sand)"></i>Vorab</span><span><i style="background:var(--petrol)"></i>Abschluss</span></div>${barsHtml(r.pre.vals,r.post.vals)}</div></section>`:'';
  const count=Object.keys(practiced).length;
  return `<div class="stack-lg">
  <section class="hero">
    <p class="eyebrow">${esc(sem.format)}${sem.place?' · '+esc(sem.place):''}</p>
    <h1>${esc(sem.title)}</h1>
    ${sem.subtitle?`<p class="lead muted">${esc(sem.subtitle)}</p>`:''}
    <div class="row between"><p>Hallo ${esc(S.me.name)}.${count?` Du hast schon ${count} ${count===1?'Übung':'Übungen'} im Alltag ausprobiert.`:''}</p><span class="row" style="gap:14px"><button class="link small" data-act="choose">Anderes Seminar</button><button class="link small" data-go="mydata">Meine Daten</button></span></div>
  </section>
  <section class="grid2">${tasks.join('')}</section>
  <section class="stack"><h2>Dein Weg</h2><div class="card"><ol class="path">${pathHtml||'<li><span class="dot"></span><div><p class="muted">Termine folgen.</p></div></li>'}</ol></div></section>
  <section class="stack"><div class="row between"><h2>Das haben wir geübt</h2></div><p class="care">Alles darf, nichts muss. Wenn sich eine Übung nicht gut anfühlt, hör auf und spür nach.</p>${exHtml}</section>
  ${cmp}
  <p class="quote">Präsenz heißt nicht, nach außen perfekt zu wirken. Präsenz heißt, innerlich da zu sein.</p>
  </div>`;
}
function exerciseHtml(e,sid,checked){

function spark(vals){
  const pts=vals.filter(v=>v!=null);if(pts.length<1)return '';
  const w=120,h=28,step=pts.length>1?w/(pts.length-1):0;
  const xy=pts.map((v,i)=>[pts.length>1?i*step:w/2,h-3-(v/10)*(h-6)]);
  return `<svg class="spark" width="${w}" height="${h}" viewBox="-4 0 ${w+8} ${h}" aria-label="Anspannung: ${pts.join(', ')}"><polyline points="${xy.map(p=>p.join(',')).join(' ')}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>${xy.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===xy.length-1?3:2}" fill="currentColor"/>`).join('')}</svg>`;
}
function adminAuswertung(){

  const people=allResponses().filter(r=>r.seminars&&r.seminars[sem.id]).sort((a,b)=>String(a.name).localeCompare(b.name));
  const recs=people.map(p=>p.seminars[sem.id]);
  const pre=recs.filter(r=>r.pre),post=recs.filter(r=>r.post);
  const avgVals=list=>{const o={};ITEMS.forEach(it=>{o[it.k]=avg(list.map(r=>r.vals&&r.vals[it.k]).filter(v=>v!=null))});return o};
  const nx=nextSession(sem);

  <div class="stats"><div class="stat"><b>${people.length}</b><span>Teilnehmerinnen</span></div><div class="stat"><b>${pre.length}</b><span>Selbsteinschätzungen vorab</span></div><div class="stat"><b>${nx?ciNext.length:'–'}</b><span>${nx?'Check-Ins für '+esc(fmtDate(nx.date)):'Alle Termine durchgeführt'}</span></div><div class="stat"><b>${post.length}</b><span>Abschluss-Einschätzungen</span></div></div>
  ${nx&&ciNext.length?`<div class="card stack"><h3>So kommt die Gruppe zum nächsten Termin</h3><div class="row">${ZUSTAND.map(z=>`<span class="pill ${z.k==='strom'?'warn':z.k==='da'?'ok':''}">${z.t}: ${zCount(z.k)}</span>`).join('')}</div><p class="small muted">Ø Anspannung ${n1(avg(ciNext.map(r=>r.checkins[nx.id].anspannung)))} · Ø Energie ${n1(avg(ciNext.map(r=>r.checkins[nx.id].energie)))} (0 bis 10)</p></div>`:''}
  ${pre.length?`<div class="card stack"><h3>Gruppe im Durchschnitt</h3><div class="legend"><span><i style="background:var(--sand)"></i>Vorab</span>${post.length?'<span><i style="background:var(--petrol)"></i>Abschluss</span>':''}</div>${barsHtml(avgVals(pre.map(r=>r.pre)),post.length?avgVals(post.map(r=>r.post)):null)}</div>`:''}
  <div class="card">${people.length?people.map(p=>personHtml(p,sem)).join(''):`<div class="empty"><b>Noch keine Teilnehmerinnen in diesem Seminar.</b><span>Sobald jemand das Seminar auswählt und etwas einträgt, erscheint es hier.</span></div>`}</div>
  </div>`;
}
function personHtml(p,sem){

  const ciList=ses.map(x=>({x,c:(r.checkins||{})[x.id]})).filter(o=>o.c);
  const zt=k=>(ZUSTAND.find(z=>z.k===k)||{}).t||'–';
  const pr=Object.keys(r.practiced||{}).map(exById).filter(Boolean).map(e=>e.title);
  const texts=r.pre&&r.pre.texts||{};
  return `<details class="person"><summary><span><b>${esc(p.name||'Ohne Namen')}</b><br><span class="small muted">${r.pre?'Vorab ✓':'Vorab offen'} · ${ciList.length} von ${ses.length} Check-Ins${r.post?' · Abschluss ✓':''}</span></span>${spark(ciList.map(o=>o.c.anspannung))}</summary>
  <div class="body">
  ${r.pre?`<div class="stack" style="gap:10px"><h3>Selbsteinschätzung</h3>${barsHtml(r.pre.vals,r.post&&r.post.vals)}

  ${ciList.length?`<div class="stack" style="gap:10px"><h3>Check-Ins</h3>${ciList.map(({x,c})=>`<dl class="kv"><dt>${esc(fmtDate(x.date))}</dt><dd><b>${esc(zt(c.zustand))}</b> · Anspannung ${n1(c.anspannung)} · Energie ${n1(c.energie)}${c.aufgefallen?`<br>Aufgefallen: ${esc(c.aufgefallen)}`:''}${c.heute?`<br>Braucht heute: ${esc(c.heute)}`:''}</dd></dl>`).join('')}</div>`:''}

/* ---------- Ereignisse ---------- */
document.addEventListener('input',e=>{const t=e.target;if(t.matches('input[type=range][data-out]')){const o=document.getElementById(t.dataset.out);if(o)o.textContent=t.value}});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.matches('[data-act="practiced"]')){const r=myRec(t.dataset.sid);r.practiced=r.practiced||{};if(t.checked)r.practiced[t.dataset.eid]=new Date().toISOString();else delete r.practiced[t.dataset.eid];await persistMe();render()}
  if(t.matches('[data-act="eval-sem"]')){S.evalSid=t.value;render()}
});
document.addEventListener('click',async e=>{
  const g=e.target.closest('[data-go]');
  if(g){e.preventDefault();go(g.dataset.go);return}
  const a=e.target.closest('[data-act]');if(!a||a.tagName==='INPUT'||a.tagName==='SELECT')return;
  const act=a.dataset.act;
  if(act==='flash-x'){S.flash=null;renderFlash()}
  else if(act==='logout'){if(FB&&S.auth)await FB.signOut(S.auth);go('home')}
  else if(act==='login-again')go('login')
  else if(act==='google'){try{await FB.signInWithPopup(S.auth,new FB.GoogleAuthProvider());go('home')}catch(err){showFlash(authErr(err,'google'),true)}}
  else if(act==='reset'||act==='send-link'){const em=(document.getElementById('l-email')||{}).value||'';if(!em.includes('@')){showFlash('Bitte trag zuerst deine E-Mail-Adresse ein.',true);return}
    try{if(act==='reset'){await FB.sendPasswordResetEmail(S.auth,em.trim());showFlash('Wir haben dir eine Mail zum Zurücksetzen geschickt. Schau auch im Spam-Ordner nach.')}else{await sendLink(em.trim());go('login',{sent:em.trim()})}}catch(err){showFlash(authErr(err,act),true)}}
  else if(act==='seed'){a.disabled=true;await seedDefaults()}
  else if(act==='del-me-ask'){S.delAsk=true;render()}
  else if(act==='delete-me'){if(await deleteMyData()){S.flash={msg:'Deine Daten sind gelöscht.'};go('home')}}
  else if(act==='export'){const data=JSON.stringify({exportiertAm:new Date().toISOString(),email:S.user&&S.user.email||'',daten:S.me},null,2);const u=URL.createObjectURL(new Blob([data],{type:'application/json'}));const l=document.createElement('a');l.href=u;l.download='seminarbegleitung-meine-daten.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
  else if(act==='choose')go('home',{choose:true});
  else if(act==='open-assess')go('assess',{kind:a.dataset.kind});
  else if(act==='open-checkin')go('checkin',{sess:a.dataset.sess});
  else if(act==='atab'){S.atab=a.dataset.tab;render()}
  else if(act==='new-sem'){S.editing={id:uid('sem'),title:'',subtitle:'',format:'Workshop',status:'entwurf',place:'',price:'',link:'',description:'',order:S.seminars.length+1,sessions:[{id:uid('t'),date:'',time:'',title:'Termin 1',focus:'',exerciseIds:[],done:false}]};go('sem-edit')}
  else if(act==='edit-sem'){S.editing=clone(semById(a.dataset.id));go('sem-edit')}
  else if(act==='dup-sem'){const c=clone(semById(a.dataset.id));c.id=uid('sem');c.title=c.title+' (Kopie)';c.status='entwurf';c.sessions=(c.sessions||[]).map(x=>({...x,id:uid('t'),done:false}));S.editing=c;go('sem-edit')}
  else if(act==='add-sess'){readSemForm();S.editing.sessions.push({id:uid('t'),date:'',time:'',title:'Termin '+(S.editing.sessions.length+1),focus:'',exerciseIds:[],done:false});render()}
  else if(act==='rm-sess'){readSemForm();S.editing.sessions.splice(Number(a.dataset.i),1);render()}
  else if(act==='cancel-edit'){S.editing=null;go('admin')}
  else if(act==='del-ask'){if(S.view==='sem-edit')readSemForm();else readExForm();S.delAsk=true;render()}
  else if(act==='del-no'){S.delAsk=false;render()}
  else if(act==='del-sem'){const t=S.editing.title;if(await delDoc('seminars',S.editing.id)){S.editing=null;S.flash={msg:`„${t}“ gelöscht.`};go('admin')}}
  else if(act==='del-ex'){const id=S.editing.id,t=S.editing.title;if(await delDoc('exercises',id)){
      for(const s of S.seminars){if((s.sessions||[]).some(x=>(x.exerciseIds||[]).includes(id))){const c=clone(s);c.sessions.forEach(x=>x.exerciseIds=(x.exerciseIds||[]).filter(i=>i!==id));await saveDoc('seminars',c)}}
      S.editing=null;S.flash={msg:`„${t}“ gelöscht.`};S.atab='uebungen';go('admin')}}
  else if(act==='new-ex'){S.editing={id:uid('ex'),title:'',area:AREAS[0],duration:3,summary:'',steps:[],why:''};go('ex-edit')}
  else if(act==='edit-ex'){S.editing=clone(exById(a.dataset.id));go('ex-edit')}
});
function readExForm(){const e=S.editing,v=id=>(document.getElementById(id)||{}).value||'';
  e.title=v('e-title').trim();e.area=v('e-area');const d=v('e-dur');e.duration=d===''?null:Number(d);e.summary=v('e-summary').trim();
  e.steps=v('e-steps').split('\n').map(x=>x.trim()).filter(Boolean);e.why=v('e-why').trim()}
function fd(form,name){return (form.elements[name]||{}).value||''}
document.addEventListener('submit',async e=>{
  e.preventDefault();const f=e.target;const btn=f.querySelector('button[type=submit]');if(btn)btn.disabled=true;
  try{
  if(f.id==='f-login'){const email=fd(f,'email').trim(),pass=fd(f,'pass');const how=(e.submitter&&e.submitter.value)||'login';
    try{if(how==='signup')await FB.createUserWithEmailAndPassword(S.auth,email,pass);else await FB.signInWithEmailAndPassword(S.auth,email,pass);S.flash=null;go('home')}catch(err){showFlash(authErr(err,how),true)}}
  else if(f.id==='f-confirm'){await completeLink(fd(f,'email').trim());render()}
  else if(f.id==='f-join'){const name=fd(f,'name').trim();const sem=(f.querySelector('input[name=sem]:checked')||{}).value;if(!name||!sem)return;
    S.me.name=name;S.me.current=sem;if(!S.me.consentAt)S.me.consentAt=new Date().toISOString();const r=myRec(sem);r.joinedAt=r.joinedAt||new Date().toISOString();await persistMe();go('home')}
  else if(f.id==='f-assess'){const kind=f.dataset.kind;const vals={};ITEMS.forEach(it=>vals[it.k]=Number(fd(f,'a-'+it.k)));
    const texts={};f.querySelectorAll('textarea').forEach(t=>texts[t.name.slice(2)]=t.value.trim());
    myRec(S.me.current)[kind]={at:new Date().toISOString(),vals,texts};const ok=await persistMe();
    if(ok){S.flash={msg:kind==='pre'?'Danke. Deine Einschätzung ist gespeichert.':'Danke. Unten siehst du jetzt deinen Vorher-Nachher-Vergleich.'};go('home')}}
  else if(f.id==='f-checkin'){const z=(f.querySelector('input[name=zustand]:checked')||{}).value;
    const r=myRec(S.me.current);r.checkins=r.checkins||{};
    r.checkins[f.dataset.sess]={at:new Date().toISOString(),zustand:z,anspannung:Number(fd(f,'c-anspannung')),energie:Number(fd(f,'c-energie')),
      geuebt:[...f.querySelectorAll('input[name=geuebt]:checked')].map(c=>c.value),aufgefallen:fd(f,'c-aufgefallen').trim(),heute:fd(f,'c-heute').trim()};
    const ok=await persistMe();if(ok){S.flash={msg:'Danke für deinen Check-In. Bis bald.'};go('home')}}
  else if(f.id==='f-booking'){const name=fd(f,'b-name').trim();
    const b={at:new Date().toISOString(),name,zustand:(f.querySelector('input[name=zustand]:checked')||{}).value,
      vals:{ruhe:Number(fd(f,'b-ruhe')),spueren:Number(fd(f,'b-spueren')),raum:Number(fd(f,'b-raum'))},
      wunsch:(f.querySelector('input[name=wunsch]:checked')||{}).value,zeit:(f.querySelector('input[name=zeit]:checked')||{}).value};
    b.email=fd(f,'b-email').trim();b.rec=recommend(b);
    if(await saveBooking(b))go('booking-result',{b})}
  else if(f.id==='f-sem'){readSemForm();if(!S.editing.title){showFlash('Bitte gib dem Seminar einen Titel.',true);return}
    if(await saveDoc('seminars',clone(S.editing))){S.flash={msg:`„${S.editing.title}“ gespeichert.`};S.editing=null;S.atab='seminare';go('admin')}}
  else if(f.id==='f-ex'){readExForm();if(!S.editing.title){showFlash('Bitte gib der Übung einen Titel.',true);return}
    if(await saveDoc('exercises',clone(S.editing))){S.flash={msg:`„${S.editing.title}“ gespeichert.`};S.editing=null;S.atab='uebungen';go('admin')}}
  }finally{if(btn&&document.body.contains(btn))btn.disabled=false}
});
init();
</script>
